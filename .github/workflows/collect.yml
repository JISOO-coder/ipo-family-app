name: collect
on:
  schedule:
    - cron: "30 22 * * *"   # 매일 한국시간 07:30
    - cron: "0 12 * * *"    # 매일 한국시간 21:00
  workflow_dispatch:         # 수동 실행 버튼
    inputs:
      push_test:
        description: "테스트 알림 보내기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 38커뮤니케이션에서 수집
        run: python collector/fetch_ipo.py
      - name: 판정 및 파일 생성
        run: python collector/build.py
      - name: 상장 결과 기록 (실패해도 앱 갱신은 계속)
        run: python collector/history.py
        continue-on-error: true
      - name: 앱 푸시 알림 (실패해도 앱 갱신은 계속)
        run: |
          pip install -q pywebpush
          python collector/push.py
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_TEST: ${{ inputs.push_test }}
          # 폰마다 Secret 하나 (등록 안 한 칸은 비어 있어도 괜찮음). 폰이 더 생기면 줄을 복사해 이름만 바꾸기
          PUSH_SUB_JISOO: ${{ secrets.PUSH_SUB_JISOO }}
          PUSH_SUB_MOM: ${{ secrets.PUSH_SUB_MOM }}
          PUSH_SUB_DAD: ${{ secrets.PUSH_SUB_DAD }}
          PUSH_SUB_EXTRA1: ${{ secrets.PUSH_SUB_EXTRA1 }}
          PUSH_SUB_EXTRA2: ${{ secrets.PUSH_SUB_EXTRA2 }}
          PUSH_SUB_EXTRA3: ${{ secrets.PUSH_SUB_EXTRA3 }}
      - name: 변경사항 저장
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data web/ipo.ics
          git diff --cached --quiet || (git commit -m "update ipo data" && git push)
