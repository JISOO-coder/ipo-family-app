name: collect
on:
  schedule:
    - cron: "30 22 * * *"   # 매일 한국시간 07:30
    - cron: "0 12 * * *"    # 매일 한국시간 21:00
  workflow_dispatch:         # 수동 실행 버튼 (알림 테스트는 push 실행에서)
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04   # 실행 서버 버전 고정 (ubuntu-latest 는 2026-10-19부터 Ubuntu 26으로 바뀜)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 38커뮤니케이션에서 수집
        run: python collector/fetch_ipo.py
      - name: 판정 및 파일 생성
        run: python collector/build.py
      - name: 상장 결과 기록 (실패해도 앱 갱신은 계속)
        run: python collector/history.py
        continue-on-error: true
      - name: 변경사항 저장
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data web/ipo.ics
          git diff --cached --quiet || (git commit -m "update ipo data" && git push)
